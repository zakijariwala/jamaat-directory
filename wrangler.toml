# Cloudflare Pages project config for the Jamaat Directory.
# The static frontend is built by Astro into ./dist; the /api/* routes and
# /directory.json live in ./functions as Pages Functions bound to D1 and R2.

name = "jamaat-directory"
pages_build_output_dir = "./dist"
compatibility_date = "2026-07-01"

# --- D1: source of truth for the site -------------------------------------
# Create with:  wrangler d1 create jamaat_directory
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "jamaat_directory"
database_id = "1f5be6a5-a54c-47b5-98cf-1f6486322c55"
migrations_dir = "migrations"

# NOTE: R2 is NOT bound here — the site's Functions don't use it. Only the
# nightly backup Worker uses R2 (see workers/backup/wrangler.toml).

# --- KV: per-IP rate limiting for /api/reveal ------------------------------
# Create with:  wrangler kv namespace create RATE_LIMIT
# then paste the returned id below. If unbound, reveal still works but is
# unthrottled (fine for the prototype).
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "307b5256c0604810931f425eaea9634f"

# --- Public, non-secret vars ----------------------------------------------
# Access posture is an open committee decision; ship with noindex ON.
# Flip to "false" to allow search-engine indexing (fully public posture).
[vars]
NOINDEX = "true"

# --- Secrets (NEVER put real values here) ---------------------------------
# Set with:
#   wrangler pages secret put INGEST_SECRET
#   wrangler pages secret put TURNSTILE_SECRET
# For local dev, put them in .dev.vars (gitignored) — see .dev.vars.example.
